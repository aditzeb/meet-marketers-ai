<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet Marketers AI — The internal enterprise platform for Account Managers to orchestrate AI-powered marketing content at scale.">
  <meta name="theme-color" content="#1B3A2E">

  <!-- Open Graph -->
  <meta property="og:title" content="Meet Marketers AI">
  <meta property="og:description" content="AI-orchestrated marketing content platform for Account Managers.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meet Marketers AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Meet Marketers AI</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen matching Clinic Sage neutral */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #F4F7F4;
      height: 100%;
      font-family: 'DM Sans', sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F4F7F4;
      z-index: 9999;
      gap: 24px;
      transition: opacity 0.4s ease;
    }

    #loading-screen .brand-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #loading-screen .logo-dot {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background-color: #1B3A2E;
    }

    #loading-screen .brand-name {
      font-size: 18px;
      font-weight: 600;
      color: #1B3A2E;
      letter-spacing: -0.02em;
    }

    #loading-screen .loader {
      width: 160px;
      height: 2px;
      background: #E0E8E0;
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-screen .loader-bar {
      height: 100%;
      width: 40%;
      background: #4E8B6A;
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>
<body>

  <!-- Loading screen displayed while Flutter initializes -->
  <div id="loading-screen">
    <div class="brand-mark">
      <div class="logo-dot"></div>
      <span class="brand-name">Meet Marketers AI</span>
    </div>
    <div class="loader">
      <div class="loader-bar"></div>
    </div>
  </div>

  <script>
    // Remove loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
